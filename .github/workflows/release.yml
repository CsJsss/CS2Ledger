name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build Linux binary
        env:
          CGO_ENABLED: 1
        run: wails build -platform linux/amd64

      - name: Package Linux artifact
        run: tar -czf cs2-ledger-linux-amd64.tar.gz -C build/bin cs2-ledger

      - uses: actions/upload-artifact@v4
        with:
          name: cs2-ledger-linux-amd64
          path: cs2-ledger-linux-amd64.tar.gz
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build Windows binary
        env:
          CGO_ENABLED: 1
        run: wails build -platform windows/amd64

      - name: Package Windows artifact
        run: Compress-Archive -Path build/bin/cs2-ledger.exe -DestinationPath cs2-ledger-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: cs2-ledger-windows-amd64
          path: cs2-ledger-windows-amd64.zip
          retention-days: 7

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cs2-ledger-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: cs2-ledger-windows-amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cs2-ledger-linux-amd64.tar.gz
            cs2-ledger-windows-amd64.zip
          draft: false
          generate_release_notes: true
